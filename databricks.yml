# This is a Databricks asset bundle definition for ott_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: ott_analytics
  uuid: 68ac31bf-6155-4678-844a-593e642b1823

variables:
  env: 
    description: environemnt


include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    mode: development
    default: true
    variables:
      env: dev
    workspace:
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/dev



  prod:
    mode: production
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
    variables:
      env: prod
    workspace:
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod
